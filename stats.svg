<svg xmlns="http://www.w3.org/2000/svg" width="430" height="452" viewBox="0 0 430 452" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<style>
.c{animation:in .6s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.b{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lab{fill:#8b949e;font-size:11px}.big{font-size:30px;font-weight:bold}.sub{fill:#6e7681;font-size:10px}.unit{fill:#8b949e;font-size:13px;font-weight:normal}
